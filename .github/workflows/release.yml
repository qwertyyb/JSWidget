name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Write Auth Key
        run: |
          mkdir -p .private_keys
          echo "${{ secrets.AUTH_KEY_P8_CONTENT }}" > ".private_keys/AuthKey_${{ secrets.AUTH_KEY_ID }}.p8"

      - name: Build & Export IPA
        env:
          AUTH_KEY_ID: ${{ secrets.AUTH_KEY_ID }}
          AUTH_KEY_ISSUER_ID: ${{ secrets.AUTH_KEY_ISSUER_ID }}
          APP_VERSION: ${{ github.ref_name }}
          CI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          bash scripts/build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScriptWidget-${{ github.ref_name }}
          path: build/output/*.ipa
